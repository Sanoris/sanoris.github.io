<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliance Evidence Dashboard | FutureFeed</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#0f172a',    // Slate 900
                        secondary: '#334155',  // Slate 700
                        brand: '#2563eb',      // Blue 600
                        success: '#16a34a',    // Green 600
                        warning: '#ea580c',    // Orange 600
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for a polished feel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .transition-height { transition: max-height 0.3s ease-in-out; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-primary text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <!-- Fake FutureFeed Logo -->
                <svg class="w-8 h-8 text-brand" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <span class="font-bold text-xl tracking-tight">FutureFeed</span>
            </div>
            <div class="flex items-center gap-4 text-sm font-medium">
                <span class="bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 flex items-center gap-2">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                    Acme Defense Solutions
                </span>
                <div class="w-8 h-8 bg-brand rounded-full flex items-center justify-center font-bold text-white shadow-inner">AD</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full">
        
        <!-- Page Header & Progress -->
        <div class="mb-8 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">CMMC Compliance Dashboard</h1>
                <p class="text-slate-500 mt-1">Track NIST 800-171 requirements and manage evidence.</p>
            </div>
            
            <div class="w-full md:w-1/3 bg-slate-50 p-4 rounded-lg border border-slate-100">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-sm font-semibold text-slate-600 uppercase tracking-wide">Overall Progress</span>
                    <span id="progress-text" class="text-2xl font-bold text-brand">0%</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                    <div id="progress-bar" class="bg-brand h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <p id="progress-subtext" class="text-xs text-slate-500 mt-2 text-right">0 of 0 Requirements Met</p>
            </div>
        </div>

        <!-- Categories Container -->
        <div id="categories-container" class="space-y-4">
            <!-- Rendered via JS -->
        </div>

    </main>

    <!-- Evidence Modal -->
    <div id="evidence-modal" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden items-center justify-center z-50 p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full overflow-hidden flex flex-col">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="text-lg font-bold text-slate-900">Attach Evidence</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div class="p-6">
                <p class="text-sm text-slate-500 mb-4">Requirement: <span id="modal-req-id" class="font-semibold text-slate-800"></span></p>
                
                <!-- Tabs -->
                <div class="flex border-b border-slate-200 mb-5">
                    <button id="tab-file" onclick="switchTab('file')" class="px-4 py-2 text-sm font-medium border-b-2 border-brand text-brand">File Upload</button>
                    <button id="tab-text" onclick="switchTab('text')" class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700">Text Statement</button>
                </div>

                <form id="evidence-form" onsubmit="submitEvidence(event)">
                    <div id="panel-file" class="block">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Upload Document</label>
                    
                    <label id="drop-zone" for="file-upload" class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-slate-300 border-dashed rounded-md hover:bg-slate-50 transition-colors cursor-pointer">
                        <div class="space-y-1 text-center pointer-events-none">
                            <svg class="mx-auto h-12 w-12 text-slate-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <div class="flex text-sm text-slate-600 justify-center">
                                <span class="relative font-medium text-brand">Select a file</span>
                                <p class="pl-1">or drag and drop</p>
                            </div>
                            <p class="text-xs text-slate-500">PDF, PNG, JPG, DOC up to 10MB</p>
                        </div>
                        <input id="file-upload" name="file-upload" type="file" class="sr-only" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx" onchange="updateFileName(this)">
                    </label>
                    
                    <p id="selected-filename" class="text-sm font-medium text-brand mt-2 hidden text-center"></p>
                </div>
                        <p id="selected-filename" class="text-sm font-medium text-brand mt-2 hidden text-center"></p>
                    </div>

                    <div id="panel-text" class="hidden">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Written Statement</label>
                        <textarea id="text-statement" rows="4" class="shadow-sm focus:ring-brand focus:border-brand mt-1 block w-full sm:text-sm border border-slate-300 rounded-md p-2" placeholder="Describe how this requirement is met..."></textarea>
                    </div>

                    <div class="mt-6 flex justify-end gap-3">
                        <button type="button" onclick="closeModal()" class="bg-white py-2 px-4 border border-slate-300 rounded-md shadow-sm text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none">Cancel</button>
                        <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-brand hover:bg-blue-700 focus:outline-none">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // 1. Data Model (Hardcoded placeholder data)
        const db = [
            {
                id: 'AC',
                title: 'Access Control',
                expanded: true,
                requirements: [
                    { id: 'AC.1.001', text: 'Limit system access to authorized users, processes acting on behalf of authorized users, and devices (including other systems).', evidence: ['Corporate_Access_Policy_v2.pdf'] },
                    { id: 'AC.1.002', text: 'Limit system access to the types of transactions and functions that authorized users are permitted to execute.', evidence: [] },
                    { id: 'AC.1.003', text: 'Verify and control/limit connections to and use of external system components.', evidence: ['Network_Diagram_2026.png'] },
                    { id: 'AC.1.004', text: 'Control information posted or processed on publicly accessible information systems.', evidence: [] }
                ]
            },
            {
                id: 'IR',
                title: 'Incident Response',
                expanded: false,
                requirements: [
                    { id: 'IR.2.092', text: 'Establish an operational incident-handling capability for organizational systems that includes preparation, detection, analysis, containment, recovery, and user response activities.', evidence: ['Incident_Response_Plan_Final.pdf'] },
                    { id: 'IR.2.093', text: 'Track, document, and report incidents to designated officials and/or authorities both internal and external to the organization.', evidence: [] },
                    { id: 'IR.2.094', text: 'Test the organizational incident response capability.', evidence: [] }
                ]
            },
            {
                id: 'MP',
                title: 'Media Protection',
                expanded: false,
                requirements: [
                    { id: 'MP.3.118', text: 'Protect (i.e., physically control and securely store) system media containing CUI, both paper and digital.', evidence: ['Physical_Security_Statement.txt'] },
                    { id: 'MP.3.119', text: 'Limit access to CUI on system media to authorized users.', evidence: ['Media_Access_Logs.xlsx'] },
                    { id: 'MP.3.120', text: 'Sanitize or destroy system media containing CUI before disposal or release for reuse.', evidence: [] },
                    { id: 'MP.3.121', text: 'Control the use of removable media on system components.', evidence: [] }
                ]
            }
        ];

        let activeReqId = null;
        let activeTab = 'file';

        // 2. Rendering Functions
        function render() {
            renderProgress();
            renderCategories();
        }

        function renderProgress() {
            let total = 0;
            let completed = 0;

            db.forEach(category => {
                category.requirements.forEach(req => {
                    total++;
                    if (req.evidence.length > 0) completed++;
                });
            });

            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
            
            document.getElementById('progress-text').innerText = `${percentage}%`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-subtext').innerText = `${completed} of ${total} Requirements Met`;
            
            // Color code progress bar
            const bar = document.getElementById('progress-bar');
            if(percentage === 100) bar.className = "bg-success h-2.5 rounded-full transition-all duration-500";
            else bar.className = "bg-brand h-2.5 rounded-full transition-all duration-500";
        }

        function renderCategories() {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            db.forEach((category, catIndex) => {
                // Calculate category stats
                const totalReqs = category.requirements.length;
                const completedReqs = category.requirements.filter(r => r.evidence.length > 0).length;
                const isComplete = totalReqs === completedReqs;

                // Category Header HTML
                const categoryHTML = `
                    <div class="bg-white rounded-xl shadow-sm border ${isComplete ? 'border-green-200' : 'border-slate-200'} overflow-hidden mb-4">
                        <div class="px-6 py-4 cursor-pointer hover:bg-slate-50 transition-colors flex items-center justify-between" onclick="toggleCategory(${catIndex})">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-lg flex items-center justify-center ${isComplete ? 'bg-green-100 text-green-600' : 'bg-slate-100 text-slate-600'}">
                                    <span class="font-bold">${category.id}</span>
                                </div>
                                <div>
                                    <h2 class="text-lg font-semibold text-slate-900">${category.title}</h2>
                                    <p class="text-xs text-slate-500">${completedReqs} / ${totalReqs} completed</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-4">
                                ${isComplete 
                                    ? `<span class="hidden sm:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Complete</span>` 
                                    : `<span class="hidden sm:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-orange-100 text-orange-800">Action Needed</span>`
                                }
                                <svg class="w-5 h-5 text-slate-400 transform transition-transform ${category.expanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                            </div>
                        </div>
                        
                        <div class="${category.expanded ? 'block' : 'hidden'} border-t border-slate-100 bg-slate-50/50">
                            <ul class="divide-y divide-slate-100">
                                ${category.requirements.map(req => renderRequirement(req)).join('')}
                            </ul>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', categoryHTML);
            });
        }

        function renderRequirement(req) {
            const hasEvidence = req.evidence.length > 0;
            
            // Build evidence badges
            const evidenceBadges = req.evidence.map(ev => `
                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-medium bg-blue-50 text-brand border border-blue-100 mt-2 mr-2">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
                    ${ev}
                </span>
            `).join('');

            return `
                <li class="px-6 py-5 flex flex-col sm:flex-row sm:items-start justify-between gap-4 hover:bg-slate-50 transition-colors">
                    <div class="flex items-start gap-3 flex-grow">
                        <div class="mt-0.5">
                            ${hasEvidence 
                                ? `<svg class="w-5 h-5 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`
                                : `<svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`
                            }
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-semibold text-slate-900 text-sm">${req.id}</span>
                            </div>
                            <p class="text-sm text-slate-600 mt-1 max-w-3xl">${req.text}</p>
                            ${hasEvidence ? `<div class="flex flex-wrap">${evidenceBadges}</div>` : ''}
                        </div>
                    </div>
                    <div class="sm:ml-auto flex-shrink-0 pt-1 sm:pt-0">
                        <button onclick="openModal('${req.id}')" class="inline-flex items-center gap-1.5 px-3 py-1.5 border ${hasEvidence ? 'border-slate-300 text-slate-700 bg-white hover:bg-slate-50' : 'border-brand text-brand bg-blue-50 hover:bg-blue-100'} rounded-md text-sm font-medium shadow-sm transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                            ${hasEvidence ? 'Add More' : 'Attach Evidence'}
                        </button>
                    </div>
                </li>
            `;
        }

        // 3. Interactions
        function toggleCategory(index) {
            db[index].expanded = !db[index].expanded;
            renderCategories();
        }

        function openModal(reqId) {
            activeReqId = reqId;
            document.getElementById('modal-req-id').innerText = reqId;
            document.getElementById('evidence-modal').classList.remove('hidden');
            document.getElementById('evidence-modal').classList.add('flex');
            
            // Reset forms
            document.getElementById('file-upload').value = '';
            document.getElementById('selected-filename').classList.add('hidden');
            document.getElementById('text-statement').value = '';
            switchTab('file');
        }

        function closeModal() {
            document.getElementById('evidence-modal').classList.add('hidden');
            document.getElementById('evidence-modal').classList.remove('flex');
            activeReqId = null;
        }

        function switchTab(tab) {
            activeTab = tab;
            
            // Tab Buttons styling
            const fileBtn = document.getElementById('tab-file');
            const textBtn = document.getElementById('tab-text');
            
            // Panels
            const filePanel = document.getElementById('panel-file');
            const textPanel = document.getElementById('panel-text');

            if (tab === 'file') {
                fileBtn.className = "px-4 py-2 text-sm font-medium border-b-2 border-brand text-brand";
                textBtn.className = "px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700";
                filePanel.classList.remove('hidden');
                textPanel.classList.add('hidden');
            } else {
                textBtn.className = "px-4 py-2 text-sm font-medium border-b-2 border-brand text-brand";
                fileBtn.className = "px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700";
                textPanel.classList.remove('hidden');
                filePanel.classList.add('hidden');
            }
        }

        function updateFileName(input) {
            const display = document.getElementById('selected-filename');
            if (input.files && input.files[0]) {
                display.innerText = `Selected: ${input.files[0].name}`;
                display.classList.remove('hidden');
            } else {
                display.classList.add('hidden');
            }
        }

        function submitEvidence(e) {
            e.preventDefault();
            
            let evidenceItem = "";

            if (activeTab === 'file') {
                const fileInput = document.getElementById('file-upload');
                if (fileInput.files && fileInput.files[0]) {
                    evidenceItem = fileInput.files[0].name;
                } else {
                    alert("Please select a file.");
                    return;
                }
            } else {
                const textInput = document.getElementById('text-statement').value;
                if (textInput.trim() !== '') {
                    evidenceItem = "Written_Statement.txt"; // Simulating generating a text doc
                } else {
                    alert("Please enter a statement.");
                    return;
                }
            }

            // Find requirement and add evidence
            for (let category of db) {
                const req = category.requirements.find(r => r.id === activeReqId);
                if (req) {
                    req.evidence.push(evidenceItem);
                    // Automatically expand category to show the newly added item if it was closed somehow
                    category.expanded = true; 
                    break;
                }
            }

            closeModal();
            render(); // Re-render everything with new state
        }

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-upload');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('bg-blue-50', 'border-brand');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-blue-50', 'border-brand');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-blue-50', 'border-brand');
            
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                updateFileName(fileInput);
            }
        });

        // Initialize application
        window.onload = render;
    </script>
</body>
</html>
